
set INSTR_LENGTH 3
set INSTR_EXTEST 0x0
set INSTR_IDCODE 0x1
set INSTR_SAMPLE_PRELOAD 0x2
set INSTR_USER_REG 0x3
set INSTR_BYPASS 0x7

proc read_idcode { } {
	set data 0
	irscan $INSTR_IDCODE $data -endstate IDLE
    return [drscan $tap 32 $data] 
}

source [find interface/jlink.cfg]
transport select jtag

set SPEED 2000

jtag_rclk $SPEED
adapter speed $SPEED
reset_config none

put [read_idcode]

