# connecting to rpi pico via j-link <3
bindto 0.0.0.0

#jlink 
source [find interface/jlink.cfg]
adapter speed 4000 
transport select swd 

#adapter serial 260111967

# connect to core0, program is not using core1
set CHIPNAME rp2040
source [find /home/pitchu/tools/openocd/tcl/target/rp2040.cfg]

init 

# select device 
jlink config usb 1

reset halt
